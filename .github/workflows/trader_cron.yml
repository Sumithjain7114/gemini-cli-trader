name: Nifty 500 Signal Scanner

on:
  schedule:
    - cron: '15,45 3-9 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: nifty500-signal-scanner-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Scan Market Data (No Orders)
        env:
          ANGELONE_API_KEY: ${{ secrets.ANGELONE_API_KEY }}
          ANGELONE_CLIENT_CODE: ${{ secrets.ANGELONE_CLIENT_CODE }}
          ANGELONE_PIN: ${{ secrets.ANGELONE_PIN }}
          ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
          TRADER_CONFIG_JSON: ${{ vars.TRADER_CONFIG_JSON }}
        run: python live_cloud_trader.py

      - name: Persist Paper Position State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state.json
          if git diff --cached --quiet; then
            echo "Paper state unchanged."
          else
            git commit -m "Update paper scanner state [skip ci]" -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
